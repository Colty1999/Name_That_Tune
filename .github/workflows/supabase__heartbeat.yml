name: Supabase Heartbeat

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    
    steps:
      - name: Query Supabase to keep it active
        run: |
          curl -X POST "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/user_playlists?select=id&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
        
      - name: Report status
        if: success()
        run: echo "✅ Successfully pinged Supabase database"
        
      - name: Report failure
        if: failure()
        run: echo "❌ Failed to ping Supabase database"
